<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Регистрация LongMusic</title>
  <link rel="stylesheet" href="/static/style.css"/>
  <style>
    .auth-page { position: relative; overflow: hidden; }
    #bg-canvas { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
    .auth-page::after { content: ''; position: fixed; inset: 0; background: radial-gradient(ellipse 60% 70% at 50% 50%, transparent 20%, rgba(10,10,10,.55) 100%); pointer-events: none; z-index: 0; }
    .auth-wrap { position: relative; z-index: 1; }
    .auth-header h1 { font-size: 17px; letter-spacing: 2.5px; text-transform: uppercase; font-weight: 800; }
    .logo-text-accent { color: var(--accent); }
  </style>
</head>
<body class="auth-page">
<canvas id="bg-canvas"></canvas>
<div class="auth-wrap">
  <div class="auth-header">
    <div class="logo-mark" style="margin:0 auto">
      <svg viewBox="0 0 24 24"><path d="M12 3v10.55A4 4 0 1 0 14 17V7h4V3h-6z"/></svg>
    </div>
    <h1><span class="logo-text-accent">LongMusic</span></h1>
    <p>Создай аккаунт и слушай без ограничений</p>
  </div>

  <div class="card">
    <form id="form" novalidate>
      <div style="margin-bottom:18px">
        <label class="field-label" for="email">Электронная почта</label>
        <div style="position:relative">
          <input class="input" type="email" id="email" name="email" placeholder="example@mail.ru" autocomplete="email"/>
          <span id="email-icon" style="position:absolute;right:13px;top:50%;transform:translateY(-50%);font-size:16px;pointer-events:none;display:none"></span>
        </div>
        <span class="field-msg" id="email-msg"></span>
      </div>

      <div style="margin-bottom:18px">
        <label class="field-label" for="login">Логин</label>
        <input class="input" type="text" id="login" name="login" placeholder="от 4 до 20 символов" autocomplete="username"/>
        <span class="field-msg" id="login-msg"></span>
      </div>

      <div style="margin-bottom:8px">
        <label class="field-label" for="password">Пароль</label>
        <div style="position:relative">
          <input class="input" type="password" id="password" name="password" placeholder="не менее 8 символов" autocomplete="new-password" style="padding-right:44px"/>
          <button type="button" id="togglePass" style="position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--text-hint);padding:0;display:flex;align-items:center" aria-label="Показать пароль">
            <svg id="eyeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
      </div>

      <div id="pass-rules" style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:18px;display:none">
        <span class="pill" id="r-len">8+ символов</span>
        <span class="pill" id="r-upper">A–Z</span>
        <span class="pill" id="r-digit">0–9</span>
        <span class="pill" id="r-special">!@#</span>
      </div>
      <span class="field-msg" id="pass-msg"></span>

      <button type="submit" class="btn btn-full" id="submitBtn" style="margin-top:6px">
        <span class="spinner" id="spin"></span>
        <span id="btn-text">Зарегистрироваться</span>
      </button>
    </form>

    <div class="divider">или</div>
    <p style="text-align:center;font-size:13px;color:var(--text-secondary)">
      Уже есть аккаунт?
      <a href="login.html" style="color:var(--accent);font-weight:700;text-decoration:none;border-bottom:1px solid rgba(179,255,0,.3);padding-bottom:1px">Войти</a>
    </p>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
  (function(){const canvas=document.getElementById('bg-canvas');const ctx=canvas.getContext('2d');const NOTE_CHARS=['♪','♫','♩','♬','♭','♮'];const notes=[];function resize(){canvas.width=window.innerWidth;canvas.height=window.innerHeight;}resize();window.addEventListener('resize',resize);function spawnNote(){notes.push({char:NOTE_CHARS[Math.floor(Math.random()*NOTE_CHARS.length)],x:Math.random()*window.innerWidth,y:window.innerHeight+30,size:14+Math.random()*26,speed:0.25+Math.random()*0.55,drift:(Math.random()-0.5)*0.4,rot:(Math.random()-0.5)*0.6,angle:(Math.random()-0.5)*0.5,alpha:0.06+Math.random()*0.1,life:0});}for(let i=0;i<18;i++){spawnNote();notes[notes.length-1].y=Math.random()*window.innerHeight;}const waves=Array.from({length:7},(_,i)=>({yRatio:0.1+i*0.13,amp:10+Math.random()*22,freq:0.006+Math.random()*0.008,speed:0.18+Math.random()*0.35,phase:Math.random()*Math.PI*2,alpha:0.045+Math.random()*0.07,width:0.8+Math.random()*0.4}));let spawnTimer=0;function draw(ts){const W=canvas.width,H=canvas.height,t=ts*0.001;ctx.clearRect(0,0,W,H);waves.forEach(w=>{ctx.beginPath();const baseY=H*w.yRatio;for(let x=0;x<=W;x+=2){const y=baseY+Math.sin(x*w.freq+t*w.speed+w.phase)*w.amp+Math.sin(x*w.freq*2.3+t*w.speed*1.7)*w.amp*0.3;x===0?ctx.moveTo(x,y):ctx.lineTo(x,y);}ctx.strokeStyle=`rgba(179,255,0,${w.alpha})`;ctx.lineWidth=w.width;ctx.stroke();});spawnTimer+=0.016;if(spawnTimer>1.8&&notes.length<30){spawnNote();spawnTimer=0;}for(let i=notes.length-1;i>=0;i--){const n=notes[i];n.y-=n.speed;n.x+=n.drift;n.angle+=n.rot*0.008;n.life+=0.016;let a=n.alpha;if(n.life<1.5)a*=n.life/1.5;if(n.y<80)a*=Math.max(0,n.y/80);ctx.save();ctx.translate(n.x,n.y);ctx.rotate(n.angle);ctx.font=`${n.size}px serif`;ctx.fillStyle=`rgba(179,255,0,${a})`;ctx.fillText(n.char,0,0);ctx.restore();if(n.y<-40)notes.splice(i,1);}requestAnimationFrame(draw);}requestAnimationFrame(draw);})();

  const $=id=>document.getElementById(id);
  const emailEl=$('email'),loginEl=$('login'),passEl=$('password'),submitBtn=$('submitBtn');
  const rules={len:{el:$('r-len'),test:v=>v.length>=8},upper:{el:$('r-upper'),test:v=>/[A-Z]/.test(v)},digit:{el:$('r-digit'),test:v=>/[0-9]/.test(v)},special:{el:$('r-special'),test:v=>/[!@#$%^&*]/.test(v)}};

  function msg(id,text,type){const el=$(id);el.textContent=text;el.className='field-msg'+(type?' '+type:'');}
  function setState(input,state){input.classList.remove('error','valid');if(state)input.classList.add(state);}
  function validateEmail(){const v=emailEl.value.trim();if(!v){setState(emailEl,'');msg('email-msg','');return false;}const ok=/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v);setState(emailEl,ok?'valid':'error');msg('email-msg',ok?'':'Введите корректный адрес почты',ok?'':'err');$('email-icon').style.display='block';$('email-icon').textContent=ok?'✓':'';$('email-icon').style.color=ok?'var(--accent)':'var(--error)';return ok;}
  function validateLogin(){const v=loginEl.value.trim();if(!v){setState(loginEl,'');msg('login-msg','');return false;}if(v.length<4){setState(loginEl,'error');msg('login-msg','Минимум 4 символа','err');return false;}if(v.length>20){setState(loginEl,'error');msg('login-msg','Максимум 20 символов','err');return false;}if(!/^[a-zA-Z0-9_]+$/.test(v)){setState(loginEl,'error');msg('login-msg','Только латиница, цифры и _','err');return false;}setState(loginEl,'valid');msg('login-msg','','ok');return true;}
  function validatePass(){const v=passEl.value;$('pass-rules').style.display=v?'flex':'none';const allOk=Object.values(rules).map(r=>{const ok=r.test(v);r.el.classList.toggle('ok',ok);return ok;}).every(Boolean);if(!v){setState(passEl,'');return false;}setState(passEl,allOk?'valid':'error');return allOk;}

  emailEl.addEventListener('blur',validateEmail);
  emailEl.addEventListener('input',()=>{if(emailEl.classList.contains('error')||emailEl.classList.contains('valid'))validateEmail();});
  loginEl.addEventListener('blur',validateLogin);
  loginEl.addEventListener('input',()=>{if(loginEl.value.length>2)validateLogin();});
  passEl.addEventListener('input',validatePass);
  $('togglePass').addEventListener('click',()=>{const show=passEl.type==='password';passEl.type=show?'text':'password';$('eyeIcon').innerHTML=show?'<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>':'<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';});

  let toastT;
  function toast(text,type=''){clearTimeout(toastT);const el=$('toast');el.textContent=text;el.className='toast show '+type;toastT=setTimeout(()=>el.className='toast',3500);}

  $('form').addEventListener('submit',async e=>{
    e.preventDefault();
    const ok=validateEmail()&validateLogin()&validatePass();
    if(!ok){toast('Исправьте ошибки в форме','error');return;}
    submitBtn.disabled=true;$('spin').style.display='block';$('btn-text').textContent='Отправляем...';
    try{
      const res=await fetch('/api/auth/register',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({email:emailEl.value.trim(),login:loginEl.value.trim(),password:passEl.value})
      });
      const data=await res.json();
      if(!res.ok){toast('Ошибка: '+(data.error||'неизвестная ошибка'),'error');return;}
      toast('Аккаунт создан! Войдите в систему','success');
      setTimeout(()=>{window.location.href='login.html';},1200);
    }catch(err){toast('Ошибка сети','error');}
    finally{submitBtn.disabled=false;$('spin').style.display='none';$('btn-text').textContent='Зарегистрироваться';}
  });
</script>
</body>
</html>
