    function detectAudioOnsets(url, maxScanSeconds = 30) {
        return new Promise(resolve => {
            let resolved = false;
            let ctx, tempAudio, rafId, timeoutId;
            const onsets = [];

            const finish = () => {
                if (resolved) return;
                resolved = true;
                if (rafId) cancelAnimationFrame(rafId);
                if (timeoutId) clearTimeout(timeoutId);
                try { tempAudio && tempAudio.pause(); } catch {}
                try { ctx && ctx.close(); } catch {}
                resolve(onsets);
            };

            try {
                const AC = window.AudioContext || window.webkitAudioContext;
                if (!AC) { resolve([]); return; }

                tempAudio = new Audio();
                tempAudio.crossOrigin = 'anonymous';
                tempAudio.preload = 'auto';
                tempAudio.volume = 0;
                tempAudio.src = url;
                try { tempAudio.playbackRate = 4; } catch {}

                ctx = new AC();
                const source = ctx.createMediaElementSource(tempAudio);
                const analyser = ctx.createAnalyser();
                analyser.fftSize = 1024;
                source.connect(analyser);

                const data = new Uint8Array(analyser.fftSize);

                timeoutId = setTimeout(finish, (maxScanSeconds / 4 + 4) * 1000);
                tempAudio.addEventListener('error', finish);
                tempAudio.addEventListener('canplay', () => {
                    tempAudio.play().catch(finish);
                });

                const RMS_THRESHOLD = 0.025;
                const SUSTAIN_FRAMES_NEEDED = 9;
                const MIN_GAP_BETWEEN_ONSETS = 0.6;
                let sustainCount = 0;
                let sustainStartTime = null;

                const poll = () => {
                    if (resolved) return;
                    analyser.getByteTimeDomainData(data);
                    let sumSq = 0;
                    for (let i = 0; i < data.length; i++) {
                        const v = (data[i] - 128) / 128;
                        sumSq += v * v;
                    }
                    const rms = Math.sqrt(sumSq / data.length);
                    const realTime = tempAudio.currentTime;

                    if (rms > RMS_THRESHOLD) {
                        if (sustainCount === 0) sustainStartTime = realTime;
                        sustainCount++;
                        if (sustainCount === SUSTAIN_FRAMES_NEEDED) {
                            const last = onsets[onsets.length - 1];
                            if (last === undefined || sustainStartTime - last >= MIN_GAP_BETWEEN_ONSETS) {
                                onsets.push(sustainStartTime);
                            }
                        }
                    } else {
                        sustainCount = 0;
                        sustainStartTime = null;
                    }
                    if (realTime >= maxScanSeconds || onsets.length >= 12) {
                        finish();
                        return;
                    }
                    rafId = requestAnimationFrame(poll);
                };
                rafId = requestAnimationFrame(poll);
            } catch {
                finish();
            }
        });
    }

    function matchOnsetsToLyrics(onsets, lyricsLines, maxLinesToMatch = 8, tolerance = 0.35) {
        if (!onsets.length || !lyricsLines.length) return null;

        const lineTimes = lyricsLines.slice(0, maxLinesToMatch).map(l => l.time);
        const baseTime = lineTimes[0];
        const expectedGaps = lineTimes.map(t => t - baseTime);

        let best = null;

        for (const candidateStart of onsets) {
            const offset = candidateStart - baseTime;
            let score = 0;
            let totalError = 0;

            for (const gap of expectedGaps) {
                const expectedOnsetTime = baseTime + gap + offset;
                let closest = null, closestDiff = Infinity;
                for (const o of onsets) {
                    const diff = Math.abs(o - expectedOnsetTime);
                    if (diff < closestDiff) { closestDiff = diff; closest = o; }
                }
                if (closest !== null && closestDiff <= tolerance) {
                    score++;
                    totalError += closestDiff;
                }
            }

            if (!best || score > best.score || (score === best.score && totalError < best.error)) {
                best = { offset, score, error: totalError };
            }
        }

        if (!best || best.score < 2) return null;
        return Math.round(best.offset * 10) / 10;
    }

    const HARDCODED_LYRICS_OVERRIDES = [];
    function getHardcodedLyrics(track) {
        const norm = s => (s || '').toLowerCase().trim();
        const artist = norm(track.artist), title = norm(track.title);
        const match = HARDCODED_LYRICS_OVERRIDES.find(o => o.artist === artist && o.title === title);
        return match || null;
    }

    async function ensureLyricsOffset(track) {
        const cached = loadLyricsOffset(track.id);
        if (cached !== null) {
            _lyricsOffset = cached;
            updateLyricsHighlight();
            return;
        }
        if (!_lyricsLines.length) return;

        const streamUrl = window.globalPlayer?.localObjectURLs?.[track.id] || `/api/stream/${track.id}?token=${encodeURIComponent(localStorage.getItem('token')||'')}`;

        const onsets = await detectAudioOnsets(streamUrl);
        if (_lyricsTrackId !== track.id || !_lyricsMode) return;

        let offset = matchOnsetsToLyrics(onsets, _lyricsLines);
        if (offset == null) return;
        if (Math.abs(offset) > 15) return;

        _lyricsOffset = offset;
        saveLyricsOffset(track.id, offset);
        updateLyricsHighlight();
    }


    async function fetchLyricsData(artist, title, duration, album) {
        const searchParams = new URLSearchParams({ artist_name: artist, track_name: title });
        try {
            const r = await fetch('https://lrclib.net/api/search?' + searchParams);
            if (r.ok) {
                const results = await r.json();
                if (Array.isArray(results) && results.length) {
                    const best = pickBestLyricsMatch(results, duration, album);
                    if (best) return best;
                }
            }
        } catch {}

        const params = new URLSearchParams({ artist_name: artist, track_name: title });
        if (duration) params.set('duration', String(Math.round(duration)));
        try {
            const r = await fetch('https://lrclib.net/api/get?' + params);
            if (!r.ok) return null;
            return await r.json();
        } catch { return null; }
    }

    function pickBestLyricsMatch(results, duration, album) {
        const normalize = s => (s || '').toLowerCase().replace(/[^a-zа-яё0-9]+/gi, ' ').trim();
        const withLyrics = results.filter(r => r.syncedLyrics || r.plainLyrics);
        const pool = withLyrics.length ? withLyrics : results;

        if (album) {
            const albumNorm = normalize(album);
            const albumMatch = pool.find(r => r.albumName && normalize(r.albumName) === albumNorm)
                || pool.find(r => r.albumName && normalize(r.albumName).includes(albumNorm));
            if (albumMatch) return albumMatch;
        }

        if (duration) {
            let closest = null, closestDiff = Infinity;
            for (const r of pool) {
                if (!r.duration) continue;
                const diff = Math.abs(r.duration - duration);
                if (diff < closestDiff) { closestDiff = diff; closest = r; }
            }
            if (closest && closestDiff <= 3) return closest;
        }

        return pool.find(r => r.syncedLyrics) || pool[0] || null;
    }

    function parseLRC(lrc) {
        if (!lrc) return [];
        const tagRe = /\[(\d{2}):(\d{2})\.(\d{2,3})\]/g;
        const lines = [];
        lrc.split('\n').forEach(line => {
            const tags = [...line.matchAll(tagRe)];
            if (!tags.length) return;

            const lastTag = tags[tags.length - 1];
            const text = line.slice(lastTag.index + lastTag[0].length).trim();
            if (!text) return;

            tags.forEach(m => {
                const ms   = m[3].length === 3 ? parseInt(m[3]) : parseInt(m[3]) * 10;
                const time = parseInt(m[1]) * 60 + parseInt(m[2]) + ms / 1000;
                lines.push({ time, text });
            });
        });
        return lines.sort((a, b) => a.time - b.time);
    }

    function stopLyricsSync() {
        if (_lyricsInterval) { clearInterval(_lyricsInterval); _lyricsInterval = null; }
        _lyricsActiveIdx = -1;
    }

    function updateLyricsHighlight() {
        const audio    = window.globalPlayer?.audio;
        const scroller = document.getElementById('lyricsScroller');
        if (!scroller) { stopLyricsSync(); return; }
        if (!audio || !_lyricsLines.length) return;

        const t = audio.currentTime - _lyricsOffset;
        let active = -1;
        for (let i = 0; i < _lyricsLines.length; i++) {
            if (_lyricsLines[i].time <= t) active = i; else break;
        }
        if (active === _lyricsActiveIdx) return;
        _lyricsActiveIdx = active;

        const lines = scroller.querySelectorAll('.lyrics-line');
        lines.forEach((el, i) => {
            el.classList.toggle('active', i === active);
            el.classList.toggle('past',   i <  active);
        });

        if (active >= 0 && lines[active]) {
            const el  = lines[active];
            const top = el.offsetTop - scroller.clientHeight / 2 + el.clientHeight / 2;
            scroller.scrollTo({ top: Math.max(0, top), behavior: 'smooth' });
        }
    }

    function startLyricsSync() {
        stopLyricsSync();
        updateLyricsHighlight();
        _lyricsInterval = setInterval(updateLyricsHighlight, 200);
    }

    async function loadAndShowLyrics(track) {
        if (!track) return;

        const token = ++_lyricsFetchToken;

        stopLyricsSync();
        _lyricsLines   = [];
        _lyricsTrackId = track.id;
        _lyricsOffset  = 0;

        showLyricsWrap();
        const wrap = document.getElementById('fullscreenLyricsWrap');
        if (!wrap) return;
        wrap.innerHTML = `<div class="lyrics-status">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>
        </svg>
        Загружаю текст…</div>`;

        const realDuration = window.globalPlayer?.audio?.duration;
        const durationForLookup = (realDuration && isFinite(realDuration) && realDuration > 0)
            ? realDuration
            : track.duration;

        const override = getHardcodedLyrics(track);
        const data = override
            ? { syncedLyrics: override.syncedLyrics, plainLyrics: null }
            : await fetchLyricsData(track.artist, track.title, durationForLookup, track.album);

        if (token !== _lyricsFetchToken) return;

        const w2 = document.getElementById('fullscreenLyricsWrap');
        if (!w2 || !_lyricsMode) return;

        if (!data || (!data.syncedLyrics && !data.plainLyrics)) {
            w2.innerHTML = `<div class="lyrics-status">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <circle cx="12" cy="12" r="10"/>
        <line x1="12" y1="8" x2="12" y2="12"/>
        <line x1="12" y1="16" x2="12.01" y2="16"/>
        </svg>
        Текст для этого трека не найден</div>`;
            return;
        }

        if (data.syncedLyrics) {
            _lyricsLines = parseLRC(data.syncedLyrics);
            w2.innerHTML =
                '<div id="lyricsScroller" class="lyrics-scroller">' +
                '<div class="lyrics-spacer"></div>' +
                _lyricsLines.map((l, i) =>
                    `<div class="lyrics-line" data-i="${i}">${escapeHtml(l.text)}</div>`
                ).join('') +
                '<div class="lyrics-spacer"></div>' +
                '</div>';
            w2.querySelectorAll('.lyrics-line').forEach((el, i) => {
                el.onclick = () => {
                    if (window.globalPlayer?.audio && _lyricsLines[i])
                        window.globalPlayer.audio.currentTime = _lyricsLines[i].time + _lyricsOffset;
                };
            });
            startLyricsSync();
            if (override && typeof override.offset === 'number') {
                _lyricsOffset = override.offset;
                saveLyricsOffset(track.id, override.offset);
                updateLyricsHighlight();
            } else {
                const cachedOffset = loadLyricsOffset(track.id);
                if (cachedOffset !== null) {
                    _lyricsOffset = cachedOffset;
                    updateLyricsHighlight();
                } else {
                    ensureLyricsOffset(track);
                }
            }
        } else {
            w2.innerHTML = '<div class="lyrics-plain">' +
                data.plainLyrics.split('\n').map(l =>
                    `<div class="lyrics-line-plain">${escapeHtml(l) || '<br>'}</div>`
                ).join('') + '</div>';
        }
    }

        list.querySelectorAll('.friend-row[data-login]').forEach(row => {
            row.onclick = (e) => {
                if (e.target.closest('.friend-remove-btn')) return;
                navigateTo('/user/' + row.dataset.login);
            };
        });
        list.querySelectorAll('.friend-remove-btn').forEach(btn => {
            btn.onclick = async (e) => {
                e.stopPropagation();
                if (!confirm('Удалить из друзей?')) return;
                await authFetch(`/api/friends/${btn.dataset.id}`, { method: 'DELETE' });
                toast('✅ Удалено из друзей');
                loadFriends();
            };
        });
    }

    async function loadFriendRequests() {
        const res = await authFetch('/api/friends/requests');
        if (!res.ok) return;
        const requests = await res.json() || [];
        const section = document.getElementById('friendRequestsSection');
        const list = document.getElementById('friendRequestsList');
        if (!section || !list) return;
        if (!requests.length) { section.style.display = 'none'; return; }
        section.style.display = '';
        list.innerHTML = requests.map(r => `
        <div style="display:flex;align-items:center;gap:14px;padding:10px 12px;border-radius:var(--r-md);background:var(--surface2);border:1px solid var(--border);margin-bottom:8px;">
            <div style="width:42px;height:42px;border-radius:50%;background:var(--surface3);display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;color:var(--accent);flex-shrink:0;overflow:hidden;">
                ${r.avatar_url ? `<img src="${r.avatar_url}" style="width:100%;height:100%;object-fit:cover;border-radius:50%;" onerror="this.style.display='none';this.parentElement.textContent='${(r.login||'?')[0].toUpperCase()}'">`  : (r.login||'?')[0].toUpperCase()}
            </div>
            <div style="flex:1;min-width:0;">
                <div style="font-size:14px;font-weight:600;">${escapeHtml(r.login)}</div>
                <div style="font-size:12px;color:var(--text-muted);">хочет добавить вас в друзья</div>
            </div>
            <div style="display:flex;gap:8px;">
                <button class="play-btn" style="padding:6px 14px;font-size:12px;" onclick="acceptFriendRequest(${r.id})">Принять</button>
                <button class="play-btn" style="padding:6px 14px;font-size:12px;background:var(--surface3);color:var(--text);border:1px solid var(--border);" onclick="declineFriendRequest(${r.id})">Отклонить</button>
            </div>
        </div>`).join('');
    }

    function friendRowHTML(f) {
        const letter = (f.login||'?')[0].toUpperCase();
        const avatarStr = f.avatar_url
            ? `<img src="${f.avatar_url}" style="width:100%;height:100%;object-fit:cover;border-radius:50%;" onerror="this.style.display='none';this.parentElement.textContent='${letter}'">`
            : letter;
        const nowPlaying = f.now_playing_title
            ? `<div style="font-size:12px;color:var(--accent);display:flex;align-items:center;gap:5px;margin-top:2px;"><span style="display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--accent);animation:pulse 1.4s infinite;flex-shrink:0;"></span>${escapeHtml(f.now_playing_title)} — ${escapeHtml(f.now_playing_artist||'')}</div>`
            : `<div style="font-size:12px;color:var(--text-muted);margin-top:2px;">Ничего не слушает</div>`;
        return `
        <div class="friend-row" data-login="${escapeHtml(f.login)}" style="display:flex;align-items:center;gap:14px;padding:12px;border-radius:var(--r-md);cursor:pointer;transition:background .12s;margin-bottom:4px;"
            onmouseenter="this.style.background='var(--surface2)'" onmouseleave="this.style.background='transparent'">
            <div style="width:46px;height:46px;border-radius:50%;background:var(--surface3);display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700;color:var(--accent);flex-shrink:0;overflow:hidden;">${avatarStr}</div>
            <div style="flex:1;min-width:0;">
                <div style="font-size:15px;font-weight:600;">${escapeHtml(f.login)}</div>
                ${nowPlaying}
            </div>
            <button class="friend-remove-btn" data-id="${f.id}" title="Удалить из друзей"
                style="background:none;border:none;color:var(--text-muted);cursor:pointer;width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;transition:all .15s;flex-shrink:0;"
                onmouseenter="this.style.background='var(--surface3)';this.style.color='var(--red)'"
                onmouseleave="this.style.background='none';this.style.color='var(--text-muted)'">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
            </button>
        </div>`;
    }

    async function acceptFriendRequest(requestId) {
        await authFetch(`/api/friends/requests/${requestId}/accept`, { method: 'POST' });
        toast('✅ Друг добавлен!');
        loadFriends();
        loadFriendRequests();
    }

    async function declineFriendRequest(requestId) {
        await authFetch(`/api/friends/requests/${requestId}/decline`, { method: 'POST' });
        toast('Заявка отклонена');
        loadFriendRequests();
    }

    function showAddFriendModal() {
        const existing = document.getElementById('addFriendModal');
        if (existing) existing.remove();
        const modal = document.createElement('div');
        modal.id = 'addFriendModal';
        modal.className = 'playlist-modal show';
        modal.innerHTML = `
        <div class="playlist-modal-content">
            <div class="playlist-modal-header">
                <h3>Добавить друга</h3>
                <button class="playlist-modal-close" id="addFriendClose">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                </button>
            </div>
            <div style="padding:20px;">
                <div style="font-size:13px;color:var(--text-muted);margin-bottom:12px;">Введите юзернейм пользователя</div>
                <div style="display:flex;gap:8px;">
                    <input id="addFriendInput" placeholder="юзернейм" maxlength="50"
                        style="flex:1;padding:10px 13px;background:var(--surface3);border:1px solid var(--border);border-radius:var(--r-sm);color:var(--text);font-size:14px;outline:none;font-family:inherit;transition:border-color .15s;"
                        onfocus="this.style.borderColor='rgba(var(--accent-r),var(--accent-g),var(--accent-b),.5)'"
                        onblur="this.style.borderColor='var(--border)'">
                    <button id="addFriendSend" class="play-btn" style="padding:10px 18px;">Отправить</button>
                </div>
                <div id="addFriendStatus" style="margin-top:10px;font-size:13px;min-height:20px;"></div>
            </div>
        </div>`;
        document.body.appendChild(modal);
        const close = () => { modal.classList.remove('show'); setTimeout(() => modal.remove(), 300); };
        document.getElementById('addFriendClose').onclick = close;
        modal.onclick = e => { if (e.target === modal) close(); };
        const input = document.getElementById('addFriendInput');
        const status = document.getElementById('addFriendStatus');
        input.focus();
        document.getElementById('addFriendSend').onclick = async () => {
            const login = input.value.trim();
            if (!login) return;
            if (login === user?.login) { status.style.color = 'var(--red)'; status.textContent = 'Нельзя добавить себя'; return; }
            status.style.color = 'var(--text-muted)';
            status.textContent = 'Отправляем...';
            const res = await authFetch('/api/friends/request', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ login })
            });
            if (res.ok) {
                status.style.color = 'var(--accent)';
                status.textContent = '✓ Заявка отправлена!';
                input.value = '';
                setTimeout(close, 1500);
            } else {
                const err = await res.json().catch(() => ({}));
                status.style.color = 'var(--red)';
                status.textContent = err.error || 'Пользователь не найден';
            }
        };
        input.onkeydown = e => { if (e.key === 'Enter') document.getElementById('addFriendSend').click(); };
    }

    async function renderFriendProfile(container, login) {
        container.innerHTML = `${buildTopbar('')}<div class="content-pad" id="friendProfileContent"><div style="color:var(--text-muted);padding:40px;text-align:center;">Загрузка...</div></div>`;
        initTopbarSearch();
        const res = await authFetch(`/api/users/${login}/profile`);
        if (!res.ok) {
            document.getElementById('friendProfileContent').innerHTML = '<div style="text-align:center;padding:60px;color:var(--red);">Пользователь не найден</div>';
            return;
        }
        const data = await res.json();
        const { user: u, playlists, recent_tracks } = data;
        const letter = (u.login||'?')[0].toUpperCase();
        const avatarContent = u.avatar_url
            ? `<img src="${u.avatar_url}" style="width:100%;height:100%;object-fit:cover;border-radius:50%;" onerror="this.style.display='none';this.parentElement.textContent='${letter}'">`
            : letter;
        const nowPlaying = u.now_playing_title
            ? `<div style="display:flex;align-items:center;gap:8px;margin-top:8px;font-size:14px;color:var(--accent);">
                <span style="width:8px;height:8px;border-radius:50%;background:var(--accent);display:inline-block;animation:pulse 1.4s infinite;flex-shrink:0;"></span>
                Слушает: <b>${escapeHtml(u.now_playing_title)}</b>&nbsp;—&nbsp;${escapeHtml(u.now_playing_artist||'')}
               </div>` : '';

        document.getElementById('friendProfileContent').innerHTML = `
        <div class="profile-hero" style="margin-bottom:0;">
            <div class="profile-hero-bg" id="friendHeroBg"></div>
            <div class="profile-hero-content">
                <div class="profile-avatar" id="friendAvatar">${avatarContent}</div>
                <div class="profile-name">${escapeHtml(u.login)}</div>
                <div class="profile-email" style="color:var(--text-muted);">${u.subscription==='premium'?'💎 Premium':'Free'}</div>
                ${nowPlaying}
            </div>
        </div>
        ${playlists?.length ? `
        <div class="content-pad" style="padding-top:28px;">
            <div class="section-title-sm" style="margin-bottom:16px;">Публичные плейлисты</div>
            <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:16px;">
                ${playlists.map(p => `
                <div class="track-card" onclick="navigateTo('/playlist/${p.id}')" style="cursor:pointer;">
                    <div class="track-cover" style="background:${p.cover_color||'#1a1a3a'};">
                        <div class="play-overlay"><div class="play-overlay-circle"><svg viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg></div></div>
                    </div>
                    <div class="track-name">${escapeHtml(p.name)}</div>
                    <div class="track-artist">${p.track_count||0} треков</div>
                </div>`).join('')}
            </div>
        </div>` : ''}
        ${recent_tracks?.length ? `
        <div class="content-pad" style="padding-top:24px;padding-bottom:32px;">
            <div class="section-title-sm" style="margin-bottom:16px;">Недавно слушал</div>
            <div class="recent-list">
                ${recent_tracks.map((t,i) => `
                <div class="recent-item" style="cursor:pointer;" data-idx="${i}">
                    <div class="recent-cover" style="background:${t.cover_color||'#1a3a1a'}"><img src="/api/cover/${t.id}" onerror="this.style.display='none'"></div>
                    <div class="recent-info"><div class="recent-title">${escapeHtml(t.title)}</div><div class="recent-artist">${escapeHtml(t.artist)}</div></div>
                    <div class="recent-dur">${formatDuration(t.duration)}</div>
                </div>`).join('')}
            </div>
        </div>` : ''}`;

        if (recent_tracks?.length) {
            window._recentFriendTracks = recent_tracks;
            document.querySelectorAll('#friendProfileContent .recent-item[data-idx]').forEach(item => {
                item.onclick = () => { window.globalPlayer.tracks = window._recentFriendTracks; window.globalPlayer.setQueueContext(null); window.globalPlayer.playTrack(+item.dataset.idx); };
            });
        }

        const imgEl = document.querySelector('#friendAvatar img');
        const bg = document.getElementById('friendHeroBg');
        if (imgEl && bg) {
            const extract = (el) => {
                try {
                    const c = document.createElement('canvas'); c.width = c.height = 16;
                    const ctx = c.getContext('2d'); ctx.drawImage(el, 0, 0, 16, 16);
                    const d = ctx.getImageData(0, 0, 16, 16).data;
                    let r=0,g=0,b=0,n=0;
                    for (let i=0;i<d.length;i+=4){if(d[i+3]<32)continue;r+=d[i];g+=d[i+1];b+=d[i+2];n++;}
                    if (n) bg.style.setProperty('--profile-color', `rgba(${Math.round(r/n)},${Math.round(g/n)},${Math.round(b/n)},.42)`);
                } catch(e) {}
            };
            if (imgEl.complete && imgEl.naturalWidth) extract(imgEl);
            else imgEl.onload = () => extract(imgEl);
        }
    }

    const _origRenderProfile = renderProfile;
    renderProfile = async function(container) {
        await _origRenderProfile.call(this, container);
        authFetch('/api/friends').then(r=>r.ok?r.json():[]).then(friends => {
            const el = document.getElementById('profileFriendsCount');
            if (el) el.textContent = `${(friends||[]).length} друзей`;
        }).catch(()=>{});
    };

    async function adminRenderArtists(c) {
        const r = await authFetch('/api/admin/artists');
        if (!r.ok) { c.innerHTML = '<div style="color:#ff6b6b;padding:20px">Ошибка загрузки</div>'; return; }
        let artists = await r.json();
        const render = (list) => {
            c.innerHTML = `
            <div class="admin-search-row">
                <input class="admin-search-input" id="artistSearch" placeholder="Поиск исполнителя...">
                <span style="color:var(--text-dim);font-size:12px;">${list.length} исполнителей</span>
                <button class="admin-btn primary" onclick="adminCreateArtist()">+ Добавить</button>
            </div>
            <div style="overflow-x:auto;">
            <table class="admin-table">
                <thead><tr><th>ID</th><th>Имя</th><th>Треков</th><th>Аватар</th><th>Действия</th></tr></thead>
                <tbody>
                ${list.map(a => `<tr>
                    <td style="color:var(--text-dim);">#${a.id}</td>
                    <td style="font-weight:600;">${escapeHtml(a.name)}</td>
                    <td style="color:var(--accent);">${a.track_count ?? 0}</td>
                    <td>${a.avatar_url ? `<img src="${a.avatar_url}" style="width:32px;height:32px;border-radius:50%;object-fit:cover;">` : '<span style="color:var(--text-dim);font-size:11px;">нет</span>'}</td>
                    <td><div class="actions">
                        <button class="admin-btn" onclick="adminEditArtist(${a.id},'${escapeHtml(a.name).replace(/'/g,'\\&apos;')}')">Изменить</button>
                        <button class="admin-btn danger" onclick="adminDeleteArtist(${a.id},'${escapeHtml(a.name).replace(/'/g,'\\&apos;')}')">Удалить</button>
                    </div></td>
                </tr>`).join('')}
                </tbody>
            </table></div>`;
            document.getElementById('artistSearch').oninput = (e) => {
                const q = e.target.value.toLowerCase();
                render(artists.filter(a => a.name.toLowerCase().includes(q)));
            };
        };
        render(artists);

        window.adminCreateArtist = async () => {
            const name = prompt('Имя исполнителя:'); if (!name?.trim()) return;
            const fd = new FormData(); fd.append('name', name.trim());
            const res = await authFetch('/api/admin/artists', { method: 'POST', body: fd });
            if (res.ok) { toast('✅ Исполнитель добавлен'); const r2 = await authFetch('/api/admin/artists'); artists = await r2.json(); render(artists); }
            else toast('❌ Ошибка');
        };
        window.adminEditArtist = async (id, name) => {
            const newName = prompt('Новое имя:', name); if (!newName?.trim() || newName.trim() === name) return;
            const res = await authFetch(`/api/admin/artists/${id}`, {
                method: 'PATCH', headers: {'Content-Type':'application/json'},
                body: JSON.stringify({ name: newName.trim() })
            });
            if (res.ok) { toast('✅ Исполнитель обновлён'); const r2 = await authFetch('/api/admin/artists'); artists = await r2.json(); render(artists); }
            else toast('❌ Ошибка');
        };
        window.adminDeleteArtist = async (id, name) => {
            if (!confirm(`Удалить исполнителя "${name}"?`)) return;
            const res = await authFetch(`/api/admin/artists/${id}`, { method: 'DELETE' });
            if (res.ok) { toast('🗑️ Исполнитель удалён'); const r2 = await authFetch('/api/admin/artists'); artists = await r2.json(); render(artists); }
            else toast('❌ Ошибка');
        };
    }
</script>

<script>
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/sw.js').catch(() => {});
    }
    (function() {
        const fs = document.getElementById('fullscreenPlayer');
        if (!fs) return;
        let startX = 0, startY = 0, moved = false;
        fs.addEventListener('touchstart', e => {
            startX = e.touches[0].clientX;
            startY = e.touches[0].clientY;
            moved = false;
        }, { passive: true });
        fs.addEventListener('touchmove', e => {
            const dx = e.touches[0].clientX - startX;
            const dy = e.touches[0].clientY - startY;
            if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 8) moved = true;
        }, { passive: true });
        fs.addEventListener('touchend', e => {
            if (!moved) return;
            const dx = e.changedTouches[0].clientX - startX;
            if (Math.abs(dx) < 50) return;
            if (dx > 0) {
                window.globalPlayer.nextTrack();
            } else {
                window.globalPlayer.prevTrack();
            }
            setTimeout(() => {
                if (typeof updateFullscreenContent === 'function') updateFullscreenContent();
                if (typeof window.updateFullscreenNeighbors === 'function') window.updateFullscreenNeighbors();
            }, 100);
        });
    })();

</script>
</body>
